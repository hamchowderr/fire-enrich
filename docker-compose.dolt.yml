# Dolt for a deployed Fire Enrich, on your own server. Setup, TLS and the
# Vercel env vars it produces: docs/dolt-setup.md.
#
#   docker compose -f docker-compose.dolt.yml up -d
#
# Needs deploy/dolt/dolt.env (copied from dolt.env.example) and
# deploy/dolt/certs/server.crt + server.key before the first start.
name: fire-enrich-dolt

services:
  dolt:
    # Same exact tag as CI's `migrate` job. Bump both together (CLAUDE.md,
    # "Database migrations"), and never pin lower than a server already runs.
    image: dolthub/dolt-sql-server:2.3.1
    restart: unless-stopped
    # DOLT_ROOT_PASSWORD, DOLT_DATABASE, DOLT_USER, DOLT_PASSWORD and
    # DOLT_USER_HOST. The image creates the database and user on first start.
    env_file: deploy/dolt/dolt.env
    ports:
      - '3306:3306'
    volumes:
      - dolt-data:/var/lib/dolt
      - ./deploy/dolt/config.yaml:/etc/dolt/servercfg.d/config.yaml:ro
      - ./deploy/dolt/certs:/etc/dolt/certs:ro

volumes:
  dolt-data:
